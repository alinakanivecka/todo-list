<form class="task-form" [formGroup]="todoForm" (ngSubmit)="submitForm()">
  <div class="task-form__field">
    <input class="task-form__input" type="text" placeholder="What needs to be done?" formControlName="todo">
  </div>

  <div class="task-form__error-slot">
    @if(todoErrorMessage) {
    <p class="task-form__error-text">{{todoErrorMessage}}</p>
    }
  </div>

  <app-select formControlName="priority" [options]="taskPriorityOptions" placeholder="Priority" ariaLabel="Task priority"></app-select>

  <button class="task-form__submit add-btn " type="submit" [disabled]="todoForm.invalid || isCreating()">
    @if (isCreating()) {
    <i class="fa-solid fa-spinner task-form__spinner" aria-hidden="true"></i>
    Adding...
    } @else {
    <i class="fa-solid fa-plus" aria-hidden="true"></i>
    Add task
    }
  </button>

  @if (createErrorMessage()) {
  <p class="task-form__request-error" role="alert">
    <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>

    {{ createErrorMessage() }}
  </p>
  }
</form>
