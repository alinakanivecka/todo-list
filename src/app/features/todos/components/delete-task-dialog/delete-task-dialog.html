<dialog #dialog class="delete-dialog" aria-labelledby="delete-task-title"
  aria-describedby="delete-task-description" [attr.aria-busy]="isLoading()" (cancel)="cancel($event)">
  <div class="delete-dialog__content">
    <button class="delete-dialog__close" type="button" aria-label="Close dialog"
      [disabled]="isLoading()" (click)="cancel()">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>

    <div class="delete-dialog__icon" aria-hidden="true">
      <i class="fa-regular fa-trash-can"></i>
    </div>
    <h2 id="delete-task-title" class="delete-dialog__title">Delete task?</h2>
    <p id="delete-task-description" class="delete-dialog__description">
      Are you sure you want to delete this task? This action cannot be undone.
    </p>

    @if (taskTitle()) {
      <div class="delete-dialog__task">
        <span class="delete-dialog__task-label">Task</span>
        <p>{{ taskTitle() }}</p>
      </div>
    }

    @if (errorMessage()) {
      <p class="delete-dialog__error" role="alert">{{ errorMessage() }}</p>
    }

    <div class="delete-dialog__actions">
      <button class="delete-dialog__button delete-dialog__button--cancel" type="button"
        autofocus [disabled]="isLoading()" (click)="cancel()">Cancel</button>
      <button class="delete-dialog__button delete-dialog__button--delete" type="button"
        [disabled]="isLoading()" (click)="confirm()">
        {{ isLoading() ? 'Deleting...' : 'Delete task' }}
      </button>
    </div>
  </div>
</dialog>
